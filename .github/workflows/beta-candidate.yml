name: Beta candidate gate
on:
  workflow_dispatch:
  push:
    branches: [codex/mica-baseline-reconciliation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run beta:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-candidate-evidence
          path: |
            test-results/
            playwright-report/
            docs/evidence/client-reset-2026-10-03/corrected-manifest.json
          retention-days: 7
